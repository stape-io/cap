name: Release to Production

run-name: Release capjs by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'semantic version'
        default: ""

jobs:
  precheck:
    name: Precheck by ${{ github.actor }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: europe-west1-docker.pkg.dev
      REPOSITORY: stape-production/services
    outputs:
      image_name: ${{ steps.resolve.outputs.image_name }}
      version: ${{ steps.resolve.outputs.version }}
      manual_version: ${{ steps.resolve.outputs.manual_version }}
      tag_exists: ${{ steps.check.outputs.tag_exists }}
      require_approval: ${{ steps.decide.outputs.require_approval }}
    steps:
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/492147627914/locations/global/workloadIdentityPools/github/providers/stape-io
          service_account: github-actions@stape-production.iam.gserviceaccount.com
          token_format: access_token

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: stape-production

      - id: suggest
        name: Suggest next version
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::Suggest version context"
          echo "Registry: ${REGISTRY}"
          echo "Repository: ${REPOSITORY}"
          IMAGE="${REGISTRY}/${REPOSITORY}/capjs"
          echo "Image: ${IMAGE}"
          echo "gcloud: $(gcloud --version | head -n1)"
          echo "Project: ${CLOUDSDK_CORE_PROJECT:-${CLOUDSDK_PROJECT:-unknown}}"
          echo "::endgroup::"

          echo "::group::Fetch tags"
          TAGS_RAW="$(gcloud artifacts docker images list "$IMAGE" --include-tags --format='value(tags)')"
          echo "Raw tags:"
          echo "${TAGS_RAW}"
          echo "::endgroup::"

          echo "::group::Filter semver tags"
          TAGS="$(echo "$TAGS_RAW" \
            | tr ',;' '\n' \
            | sed '/^$/d' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true
          )"
          echo "Semver tags:"
          echo "${TAGS}"
          echo "::endgroup::"

          LATEST="$(echo "$TAGS" | sort -V | tail -n1)"
          if [ -n "$LATEST" ]; then
            IFS='.' read -r major minor patch <<< "$LATEST"
            SUGGESTED="${major}.${minor}.$((patch + 1))"
          else
            SUGGESTED="0.1.0"
          fi
          echo "suggested=${SUGGESTED}" >> "$GITHUB_OUTPUT"
          echo "Suggested version: ${SUGGESTED}" >> "$GITHUB_STEP_SUMMARY"

      - id: resolve
        name: Resolve version
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_NAME="capjs"
          if [ -z "${{ inputs.version }}" ]; then
            VERSION="${{ steps.suggest.outputs.suggested }}"
            MANUAL="false"
            echo "No version provided; using suggested ${VERSION}." >> "$GITHUB_STEP_SUMMARY"
          else
            VERSION="${{ inputs.version }}"
            MANUAL="true"
            echo "Manual version provided: ${VERSION}." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "image_name=${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "manual_version=${MANUAL}" >> "$GITHUB_OUTPUT"

      - id: check
        name: Check if image tag exists
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${REGISTRY}/${REPOSITORY}/capjs"
          TAG="${{ steps.resolve.outputs.version }}"
          if gcloud artifacts docker images list "$IMAGE" --include-tags --format='value(tags)' \
            | tr ',;' '\n' \
            | grep -Fxq "${TAG}"; then
            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} already exists for ${IMAGE}." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${TAG} does not exist." >> "$GITHUB_STEP_SUMMARY"
          fi

      - id: decide
        name: Decide if approval is required
        shell: bash
        run: |
          set -euo pipefail
          MANUAL="${{ steps.resolve.outputs.manual_version }}"
          EXISTS="${{ steps.check.outputs.tag_exists }}"
          VERSION="${{ steps.resolve.outputs.version }}"
          IMAGE_NAME="${{ steps.resolve.outputs.image_name }}"
          if [ "$MANUAL" = "true" ] && [ "$EXISTS" = "true" ]; then
            echo "require_approval=true" >> "$GITHUB_OUTPUT"
            echo "Approval required: manual version exists already." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "require_approval=false" >> "$GITHUB_OUTPUT"
            echo "Approval not required." >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo ""
            echo "Image name: ${IMAGE_NAME}"
            echo "Final version: ${VERSION}"
            echo "Manual version: ${MANUAL}"
            echo "Tag exists: ${EXISTS}"
            echo "Approval required: $(cat $GITHUB_OUTPUT | grep -E '^require_approval=' | cut -d= -f2)"
          } >> "$GITHUB_STEP_SUMMARY"

  image:
    name: Build by ${{ github.actor }}
    runs-on: ubuntu-latest
    needs: precheck
    environment:
      name: ${{ needs.precheck.outputs.require_approval == 'true' && 'prod-approval' || 'auto' }}
    permissions:
      contents: read
      id-token: write
    env:
      REGISTRY: europe-west1-docker.pkg.dev
      REPOSITORY: stape-production/services
      IMAGE_NAME: ${{ needs.precheck.outputs.image_name }}
      VERSION: ${{ needs.precheck.outputs.version }}
      TAG_EXISTS: ${{ needs.precheck.outputs.tag_exists }}
      REQUIRE_APPROVAL: ${{ needs.precheck.outputs.require_approval }}
    steps:
      - name: Guard against accidental overwrite without approval
        if: ${{ env.TAG_EXISTS == 'true' && env.REQUIRE_APPROVAL != 'true' }}
        shell: bash
        run: |
          echo "Tag ${VERSION} already exists. Refusing to overwrite without approval."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/492147627914/locations/global/workloadIdentityPools/github/providers/stape-io
          service_account: github-actions@stape-production.iam.gserviceaccount.com
          token_format: access_token

      - name: Login to Google Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: standalone
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
